[project]
name = "drums-to-gp"
version = "0.1.0"
description = "Transcribe a drum stem to beat-synced MIDI and Guitar Pro 5 with separated drum-class inference."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "librosa>=0.10",
    "mido>=1.3",
    "numpy>=1.24",
    "PyGuitarPro>=0.11",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
drums-to-gp = "drums_to_gp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drums_to_gp"]
