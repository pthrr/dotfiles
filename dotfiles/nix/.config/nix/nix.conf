auto-optimise-store = true
experimental-features = nix-command flakes

# Single-user nix builds this file's settings directly (no daemon), so the
# sccache daemon socket (see modules/home/sccache.nix) can be passed into
# build sandboxes from here. The trailing ? makes the mount optional, so
# builds still work when the daemon/user session is absent.
extra-sandbox-paths = /run/user/1000/sccache?
