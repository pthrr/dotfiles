version: '3'

includes:
  nixbits:
    taskfile: ./nixbits/Taskfile.yml
    dir: ./nixbits

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format the root Nix flake and home modules
    cmds:
      - nixfmt flake.nix modules/home/*.nix

  lint:
    desc: Check Nix and shell syntax
    cmds:
      - nixfmt --check flake.nix modules/home/*.nix
      - nix flake check --no-build
      - find . -maxdepth 1 -type f -name '*.sh' -exec bash -n {} +
      - find system dotfiles -type f -name '*.sh' -exec bash -n {} +
      - find system dotfiles -type f -name '*bash*' -exec bash -n {} +
      - find dotfiles/misc/bin -type f -exec bash -n {} +
      - find system dotfiles -type f -name '*.sh' ! -path dotfiles/bash/z.sh ! -path dotfiles/bash/git-prompt.sh -exec shellcheck --severity=warning {} +
      - find system dotfiles -type f -name '*bash*' -exec shellcheck --severity=warning {} +
      - find dotfiles/misc/bin -type f -exec shellcheck --severity=warning {} +
      - nix-instantiate --parse modules/home/*.nix >/dev/null

  home:
    desc: Apply the home-manager configuration
    cmds:
      - home-manager switch --flake .#pthrr@x86_64-linux

  test:
    desc: Run shared agent hook tests
    cmds:
      - bash dotfiles/agents/.agents/hooks/write-gate.test.sh
      - bash dotfiles/bash/bashrc.test.sh
      - node --experimental-strip-types --test dotfiles/agents/.agents/hooks/adapter.test.ts
      - node --experimental-strip-types --test dotfiles/agents/.agents/opencode/plugin.test.ts

  precommit:
    desc: Run fast checks before a commit
    cmds:
      - task: lint
      - task: nixbits:ci

  ci:
    desc: Run root and nixbits checks
    cmds:
      - task: lint
      - task: test
      - task: nixbits:ci
