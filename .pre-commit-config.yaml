repos:
  - repo: local
    hooks:
      - id: dotfiles-ci
        name: dotfiles checks
        entry: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE task precommit
        language: system
        pass_filenames: false
        always_run: true
      - id: nixfmt
        name: check nix formatting
        entry: nix fmt -- --check
        language: system
        pass_filenames: false
